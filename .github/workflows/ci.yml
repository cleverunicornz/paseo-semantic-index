name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: org-ci-linux-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Expose the package-manager shim
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify source and build outputs
        run: corepack pnpm run verify
      - name: Build the Linux deployment package
        run: bash scripts/package-release.sh 0.1.0

  isolated-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: org-ci-linux-x64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/e2e.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, isolated-e2e]
    runs-on: org-ci-linux-x64
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Expose the package-manager shim
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build indexctl
        run: corepack pnpm --filter @cleverunicornz/indexctl build
      - name: Build the immutable Linux deployment package
        run: bash scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_PROMPT_DISABLED: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/paseo-semantic-index-"$GITHUB_REF_NAME"-linux-x64.tar.gz \
            dist/release/paseo-semantic-index-"$GITHUB_REF_NAME"-linux-x64.tar.gz.sha256 \
            --title "Paseo Semantic Index $GITHUB_REF_NAME" \
            --generate-notes
